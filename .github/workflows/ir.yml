name: I/R
run-name: "I/R ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  basic:
    name: Basic test (HOL)
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - name: Setup Isabelle
      uses: ./.github/actions/setup-isabelle-action

    - name: Install dependencies
      run: |
        apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv > /dev/null
        pip3 install --break-system-packages prompt_toolkit

    - name: Set Isabelle environment
      run: |
        ISABELLE_BIN=/home/isabelle/Isabelle/bin/isabelle
        echo "ISABELLE=$ISABELLE_BIN" >> $GITHUB_ENV

    - name: Build HOL heap
      run: $ISABELLE build -b HOL

    - name: Test repl.py TCP server
      run: python3 ir/test_repl.py --isabelle $ISABELLE --session HOL --stress-runs 50

  basic-no-prompt-toolkit:
    name: Basic test (HOL, no prompt_toolkit)
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - name: Setup Isabelle
      uses: ./.github/actions/setup-isabelle-action

    - name: Install dependencies (no prompt_toolkit)
      run: apt-get update -qq && apt-get install -y -qq python3 > /dev/null

    - name: Set Isabelle environment
      run: |
        ISABELLE_BIN=/home/isabelle/Isabelle/bin/isabelle
        echo "ISABELLE=$ISABELLE_BIN" >> $GITHUB_ENV

    - name: Build HOL heap
      run: $ISABELLE build -b HOL

    - name: Test repl.py TCP server (implicit server-only via missing prompt_toolkit)
      run: python3 ir/test_repl.py --isabelle $ISABELLE --session HOL --stress-runs 50

    - name: Test repl.py TCP server (explicit --server-only)
      run: python3 ir/test_repl.py --isabelle $ISABELLE --session HOL --server-only --stress-runs 50

  record_theories:
    name: Build with record_theories
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root

    steps:
    - uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
    - name: Assert instrumentation is live
      if: env.CHALK_ON == 'true'
      continue-on-error: true
      run: |
        test -n "${CURIOSITY_ROOT:-}" || { echo "::warning::CURIOSITY_ROOT unset in this step - in a container job the observables install on the host"; exit 1; }
    - name: Setup Isabelle
      uses: ./.github/actions/setup-isabelle-action

    - name: Install dependencies
      run: |
        apt-get update -qq && apt-get install -y -qq python3 python3-pip python3-venv > /dev/null
        pip3 install --break-system-packages prompt_toolkit

    - name: Set Isabelle environment
      run: |
        ISABELLE_BIN=/home/isabelle/Isabelle/bin/isabelle
        echo "ISABELLE=$ISABELLE_BIN" >> $GITHUB_ENV

    - name: Build HOL heap with record_theories
      run: $ISABELLE build -f -b -o record_theories=true HOL

    - name: Test repl.py with recorded segments
      run: python3 ir/test_repl.py --isabelle $ISABELLE --session HOL --require-source --stress-runs 50
